<script>
(function () {
  var COLORS = { "솔로남": "rgb(152, 216, 200)", "솔로녀": "rgb(187, 143, 206)" };
  var FALLBACK = ["#f6c177", "#9ccfd8", "#eb6f92", "#c4a7e7", "#31748f"];
  var original = JSON.parse(document.getElementById("kg-data").textContent);
  var hidden = {};
  var network = null, nodesDS = null, edgesDS = null;

  function colorOf(label, idx) { return COLORS[label] || FALLBACK[idx % FALLBACK.length]; }
  function propText(p) {
    return Object.keys(p || {}).map(function (k) { return k + ": " + p[k]; }).join("\n");
  }

  function render(g) {
    var labels = [];
    g.nodes.forEach(function (n) { if (labels.indexOf(n.label) < 0) labels.push(n.label); });
    var nodes = g.nodes.map(function (n) {
      var c = colorOf(n.label, labels.indexOf(n.label));
      return { id: n.id, label: (n.properties && n.properties.name) || n.id, group: n.label,
               hidden: !!hidden[n.label],
               title: "[" + n.label + "] " + n.id + "\n" + propText(n.properties),
               color: { background: c, border: c, highlight: { background: "#ffffff", border: c } },
               font: { color: "#e2e8f0", size: 16 }, shape: "dot", size: 22 };
    });
    var edges = (g.relationships || []).map(function (r, i) {
      return { id: "e" + i, from: r.start_node_id, to: r.end_node_id, label: r.type,
               title: r.type + "\n" + propText(r.properties),
               arrows: "to", color: { color: "#64748b", highlight: "#f8fafc" },
               font: { color: "#cbd5e1", size: 11, strokeWidth: 0, align: "middle" },
               smooth: { type: "dynamic" } };
    });
    nodesDS = new vis.DataSet(nodes); edgesDS = new vis.DataSet(edges);
    var container = document.getElementById("kg-graph");
    if (network) network.destroy();
    network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
      physics: { solver: "forceAtlas2Based", forceAtlas2Based: { gravitationalConstant: -80, springLength: 160 },
                 stabilization: { iterations: 300 } },
      interaction: { hover: true, tooltipDelay: 150 },
      edges: { selectionWidth: 2 }
    });
    updateLegend(g, labels);
  }

  function findButtons(text) {
    return Array.prototype.filter.call(document.querySelectorAll("button"), function (b) {
      return b.textContent.trim() === text;
    });
  }

  function updateLegend(g, labels) {
    labels.forEach(function (lb) {
      var cnt = g.nodes.filter(function (n) { return n.label === lb; }).length;
      Array.prototype.forEach.call(document.querySelectorAll("button"), function (b) {
        var sp = b.querySelector("span.font-medium");
        if (sp && sp.textContent.trim() === lb) {
          var c = b.querySelectorAll("span")[1]; if (c) c.textContent = "(" + cnt + ")";
          b.style.opacity = hidden[lb] ? "0.4" : "1";
          if (!b.dataset.kgBound) {
            b.dataset.kgBound = "1";
            b.addEventListener("click", function () {
              hidden[lb] = !hidden[lb];
              b.style.opacity = hidden[lb] ? "0.4" : "1";
              nodesDS.update(nodesDS.get({ filter: function (n) { return n.group === lb; } })
                .map(function (n) { return { id: n.id, hidden: !!hidden[lb] }; }));
            });
          }
        }
      });
    });
  }

  function fromTextarea() {
    var ta = document.getElementById("json-input");
    try { render(JSON.parse(ta.value)); }
    catch (err) { window.console.error("JSON 파싱 오류: " + err.message); ta.style.outline = "2px solid #ef4444"; return; }
    ta.style.outline = "";
  }

  // 관계 유형 필터: 하나라도 체크하면 체크한 유형의 관계만 표시
  function applyEdgeFilter() {
    var on = Array.prototype.filter.call(document.querySelectorAll('button[role="checkbox"][id^="type-"]'),
      function (b) { return b.getAttribute("aria-checked") === "true"; })
      .map(function (b) { return b.id.slice(5); });
    edgesDS.update(edgesDS.get().map(function (e) {
      return { id: e.id, hidden: on.length > 0 && on.indexOf(e.label) < 0 };
    }));
  }
  function bindEdgeFilters() {
    Array.prototype.forEach.call(document.querySelectorAll('button[role="checkbox"][id^="type-"]'), function (b) {
      b.addEventListener("click", function () {
        var v = b.getAttribute("aria-checked") !== "true";
        b.setAttribute("aria-checked", v ? "true" : "false");
        b.setAttribute("data-state", v ? "checked" : "unchecked");
        b.style.background = v ? "#2563eb" : ""; b.style.borderColor = v ? "#2563eb" : "";
        applyEdgeFilter();
      });
    });
  }

  window.addEventListener("load", function () {
    render(original);
    bindEdgeFilters();
    findButtons("그래프 시각화").forEach(function (b) { b.addEventListener("click", fromTextarea); });
    var resets = findButtons("초기화");
    // 첫 번째 '초기화': 입력창을 원래 JSON으로 되돌리고 다시 그리기
    if (resets[0]) resets[0].addEventListener("click", function () {
      document.getElementById("json-input").value = JSON.stringify(original, null, 2);
      hidden = {}; render(original);
    });
    // 두 번째 '초기화'(하이라이트): 숨김·선택 해제
    if (resets[1]) resets[1].addEventListener("click", function () {
      hidden = {}; nodesDS.update(nodesDS.get().map(function (n) { return { id: n.id, hidden: false }; }));
      network.unselectAll(); network.fit();
      Array.prototype.forEach.call(document.querySelectorAll("button[data-kg-bound]"), function (b) { b.style.opacity = "1"; });
    });
  });
})();
</script>
